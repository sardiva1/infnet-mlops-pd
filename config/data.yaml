# data.yaml — Dataset-specific configuration
# Controls Kaggle source, file discovery, ingestion behavior, and schema

kaggle:
  dataset: "ihasan88/car-price-prediction-and-vehicle-specifications"
  file_pattern: "*.csv"
  expected_files: [car_price_dataset.csv]
  expected_count: null

ingest:
  output_format: "parquet"
  compression: "snappy"
  chunk_size_rows: 50000
  convert_dtypes: true         # Attempt automatic dtype inference (pyarrow)
  validate_schema: true        # Fail loudly on missing required columns

schema:
  # Required columns — pipeline fails loudly if any are missing post-ingest
  # Column names from the ihasan88/car-price-prediction-and-vehicle-specifications dataset (Car Price Prediction and Vehicle Specifications)
  required_columns:
    - "Brand"
    - "Model_Year"
    - "Engine_Size"
    - "Fuel_Type"
    - "Transmission"
    - "Mileage"
    - "Doors"
    - "Owner_Count"
    - "Horsepower"
    - "Price"