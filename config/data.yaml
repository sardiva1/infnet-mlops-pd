# data.yaml — Dataset-specific configuration
# Controls Kaggle source, file discovery, ingestion behavior, and schema

kaggle:
  dataset: "shaistashahid/gaming-and-mental-health"
  file_pattern: "*.csv"
  expected_files: []
  expected_count: null

ingest:
  output_format: "parquet"
  compression: "snappy"
  chunk_size_rows: 50000
  convert_dtypes: true         # Attempt automatic dtype inference (pyarrow)
  validate_schema: true        # Fail loudly on missing required columns

schema:
  # Required columns — pipeline fails loudly if any are missing post-ingest
  # Column names from the shaistashahid/gaming-and-mental-health dataset (Gaming and Mental Health)
  required_columns:
    - "age"
    - "gender"
    - "daily_gaming_hours"
    - "game_genre"
    - "primary_game"
    - "gaming_platform"
    - "sleep_hours"
    - "sleep_quality"
    - "sleep_disruption_frequency"
    - "academic_work_performance"
    - "grades_gpa"
    - "work_productivity_score"
    - "mood_state"
    - "mood_swing_frequency"
    - "withdrawal_symptoms"
    - "loss_of_other_interests"
    - "continued_despite_problems"
    - "eye_strain"
    - "back_neck_pain"
    - "weight_change_kg"
    - "exercise_hours_weekly"
    - "social_isolation_score"
    - "face_to_face_social_hours_weekly"
    - "monthly_game_spending_usd"
    - "years_gaming"
    - "gaming_addiction_risk_level"