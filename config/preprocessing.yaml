# preprocessing.yaml — Configuração de Pré-processamento e Feature Engineering
#
# Princípio MLOps: separação entre política (YAML) e mecanismo (código).
# Para ajustar qualquer transformação, edite apenas este arquivo.
# O código em src/preprocessing.py não precisa mudar.
#
# Pipeline: data/processed/car_price.parquet
#        → data/features/car_price_features.parquet

# ── Saída ──────────────────────────────────────────────────────────────────────
preprocessing:
  output_dir: "data/features"
  output_filename: "car_price_features.parquet"
  compression: "snappy"


# ── 1. Feature de Idade do Carro ──────────────────────────────────────────────
car_age:
  year_column: "Model_Year"

# ── 2. Encoding da Variável Categórica ───────────────────────────────────────
categorical_encoding:
  - column: "Transmission"
    one_hot_prefix: "trans"            # → trans_Automatic, trans_Manual, etc.
    drop_first: false                  # mantém todas as categorias
  - column: "Fuel_Type"
    one_hot_prefix: "fuel"             # → fuel_Gasoline, fuel_Diesel, etc.
    drop_first: false                  # mantém todas as categorias


# ── 3. Features de Razão ──────────────────────────────────────────────────────
ratio_features:
  - name: "Miles_Per_Year"
    numerator: "Mileage"
    denominator: "Vehicle_Age"
    groupBy: false # razão global, sem agrupar por Vehicle_Age
  - name: "Brand_Avg_Price"
    numerator: "Price"
    denominator: "Brand"
    groupBy: true  # indica que a mediana deve ser calculada por marca
  - name: "HP_per_Liter"
    numerator: "Horsepower"
    denominator: "Engine_Size"
    groupBy: false # razão global, sem agrupar Engine_Size



# ── 4. Seleção de Features ────────────────────────────────────────────────────
# Baseado no ranking da Análise Exploratória 
feature_selection:
  target: "Price"
  features_to_keep:
    - "Engine_Size"
    - "Doors"
    - "Owner_Count"
    - "Horsepower"
    - "Price"
    - "trans_Automatic"
    - "trans_Manual"
    - "fuel_Diesel"
    - "fuel_Electric"
    - "fuel_Hybrid"
    - "fuel_Petrol"
    - "Miles_Per_Year"
    - "Brand_Avg_Price"
    - "HP_per_Liter"